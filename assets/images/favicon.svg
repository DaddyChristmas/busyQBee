<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Clean Hex Shield Frame -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33" 
           fill="#ece3cf" stroke="#1a140f" stroke-width="4"/>
  <polygon points="60,13 101,36 101,84 60,107 19,84 19,36" 
           fill="none" stroke="#b3a27f" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Left Translucent Wing -->
  <path d="M57 54 C42 36, 24 38, 26 50 C28 62, 45 66, 56 61 Z" 
        fill="#a7f3d0" fill-opacity="0.75" stroke="#1a140f" stroke-width="2.5"/>

  <!-- Right Translucent Wing -->
  <path d="M63 54 C78 36, 96 38, 94 50 C92 62, 75 66, 64 61 Z" 
        fill="#a7f3d0" fill-opacity="0.75" stroke="#1a140f" stroke-width="2.5"/>

  <!-- Bee Body Torso -->
  <ellipse cx="60" cy="74" rx="22" ry="28" fill="#f59e0b" stroke="#1a140f" stroke-width="3.5"/>

  <!-- Clean Striped Abdomen (Ink & Royal Blue) -->
  <path d="M41 65 Q60 70 79 65 L77 72 Q60 77 43 72 Z" fill="#1a140f"/>
  <path d="M40 77 Q60 82 80 77 L78 84 Q60 89 42 84 Z" fill="#1d4ed8" stroke="#1a140f" stroke-width="1.5"/>
  <path d="M46 89 Q60 93 74 89 L71 95 Q60 99 49 95 Z" fill="#1a140f"/>
  <polygon points="60,105 56,98 64,98" fill="#1a140f"/>

  <!-- Bee Head -->
  <ellipse cx="60" cy="48" rx="16" ry="14" fill="#f59e0b" stroke="#1a140f" stroke-width="3.5"/>

  <!-- Antennae with Royal Blue Nodules -->
  <path d="M55 37 Q48 24 40 26" fill="none" stroke="#1a140f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="39" cy="26" r="3.5" fill="#1d4ed8" stroke="#1a140f" stroke-width="1.5"/>

  <path d="M65 37 Q72 24 80 26" fill="none" stroke="#1a140f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="81" cy="26" r="3.5" fill="#1d4ed8" stroke="#1a140f" stroke-width="1.5"/>

  <!-- Friendly Eyes & Smile -->
  <circle cx="53" cy="46" r="3.5" fill="#1a140f"/>
  <circle cx="67" cy="46" r="3.5" fill="#1a140f"/>
  <circle cx="52" cy="44.5" r="1.2" fill="#ffffff"/>
  <circle cx="66" cy="44.5" r="1.2" fill="#ffffff"/>
  <path d="M56 54 Q60 57 64 54" fill="none" stroke="#1a140f" stroke-width="2" stroke-linecap="round"/>
</svg>
