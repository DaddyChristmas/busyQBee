<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 70s Warm Parchment Background & Ink Dropshadow -->
    <filter id="inkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#120d09" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ece3cf"/>
      <stop offset="100%" stop-color="#dfd4be"/>
    </linearGradient>
    <linearGradient id="beeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="wingVintage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="royalBlueStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Parchment Stamp Badge -->
  <rect x="10" y="10" width="180" height="180" rx="16" fill="url(#parchmentBg)" stroke="#1a140f" stroke-width="4" filter="url(#inkShadow)"/>
  <rect x="16" y="16" width="168" height="168" rx="12" fill="none" stroke="#b3a27f" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Left Translucent Wing -->
  <path d="M92 84 C70 50, 36 46, 38 68 C40 86, 68 98, 90 94 Z" 
        fill="url(#wingVintage)" stroke="#1a140f" stroke-width="3"/>
  <path d="M48 64 C60 72, 75 80, 88 88" stroke="#1a140f" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Right Translucent Wing -->
  <path d="M108 84 C130 50, 164 46, 162 68 C160 86, 132 98, 110 94 Z" 
        fill="url(#wingVintage)" stroke="#1a140f" stroke-width="3"/>
  <path d="M152 64 C140 72, 125 80, 112 88" stroke="#1a140f" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Bee Body Torso -->
  <ellipse cx="100" cy="115" rx="36" ry="46" fill="url(#beeGold)" stroke="#1a140f" stroke-width="4"/>

  <!-- Striped Abdomen (Ink & Royal Blue 70s Accents) -->
  <path d="M68 100 Q100 108 132 100 L130 112 Q100 120 70 112 Z" fill="#1a140f"/>
  <path d="M66 122 Q100 130 134 122 L131 135 Q100 144 69 135 Z" fill="url(#royalBlueStripe)" stroke="#1a140f" stroke-width="2"/>
  <path d="M74 144 Q100 152 126 144 L121 154 Q100 162 79 154 Z" fill="#1a140f"/>

  <!-- Sharp Stinger -->
  <polygon points="100,172 94,158 106,158" fill="#1a140f"/>

  <!-- Bee Head -->
  <ellipse cx="100" cy="74" rx="26" ry="22" fill="url(#beeGold)" stroke="#1a140f" stroke-width="4"/>

  <!-- Antennae with Royal Blue Nodules -->
  <path d="M92 56 Q82 36 68 40" fill="none" stroke="#1a140f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="67" cy="40" r="5" fill="#1d4ed8" stroke="#1a140f" stroke-width="2"/>

  <path d="M108 56 Q118 36 132 40" fill="none" stroke="#1a140f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="133" cy="40" r="5" fill="#1d4ed8" stroke="#1a140f" stroke-width="2"/>

  <!-- Big Stylized Eyes -->
  <ellipse cx="88" cy="72" rx="7" ry="10" fill="#1a140f"/>
  <ellipse cx="112" cy="72" rx="7" ry="10" fill="#1a140f"/>
  <circle cx="86" cy="69" r="2.5" fill="#ffffff"/>
  <circle cx="110" cy="69" r="2.5" fill="#ffffff"/>

  <!-- Cheerful Smile -->
  <path d="M94 84 Q100 88 106 84" fill="none" stroke="#1a140f" stroke-width="2.5" stroke-linecap="round"/>
</svg>
